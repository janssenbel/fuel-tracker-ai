<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="6" />

  <!-- Fuel Pump Body -->
  <g transform="translate(48, 48)">
    <!-- Base / Stand -->
    <rect x="80" y="340" width="180" height="30" rx="8" fill="#047857" />
    
    <!-- Main Pump Cabinet -->
    <rect x="96" y="90" width="148" height="255" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="10" />
    
    <!-- Digital Screen -->
    <rect x="116" y="122" width="108" height="72" rx="10" fill="#064e3b" stroke="#059669" stroke-width="4" />
    <!-- Screen Text / Economy symbols -->
    <text x="170" y="152" fill="#34d399" font-family="monospace" font-size="20" font-weight="bold" text-anchor="middle">km/L</text>
    <text x="170" y="178" fill="#a7f3d0" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">₱/km</text>

    <!-- Fuel Hose -->
    <path d="M 244 140 C 290 140, 310 200, 310 280 C 310 320, 290 340, 260 340" fill="none" stroke="#34d399" stroke-width="12" stroke-linecap="round" />

    <!-- Fuel Nozzle -->
    <path d="M 260 340 L 260 270 L 280 240 L 305 240 L 305 270 L 285 290" fill="#10b981" />
    <path d="M 280 240 L 315 200 L 325 210" fill="none" stroke="#a7f3d0" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
